<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; overflow: hidden; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #0b1220; }
        .leaflet-container { font-family: sans-serif; background: #0b1220; }
        .leaflet-control-attribution {
            background: rgba(7, 13, 23, 0.82) !important;
            color: #94a3b8 !important;
            font-size: 9px !important;
            padding: 2px 6px !important;
            border-radius: 6px 0 0 0;
        }
        .leaflet-control-attribution a { color: #38bdf8 !important; }
        .leaflet-control-zoom a {
            background: rgba(19, 31, 51, 0.96) !important;
            color: #f8fafc !important;
            border-color: #22324d !important;
        }
        .leaflet-control-zoom a:hover { background: #1e2d47 !important; }
        .layer-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 11px;
            background: rgba(7, 13, 23, 0.86);
            border: 1px solid rgba(56, 189, 248, 0.42);
            color: #e0f2fe;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            user-select: none;
        }
        .layer-toggle:active { background: rgba(56, 189, 248, 0.22); }
        #legend {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 900;
            padding: 7px 10px;
            border-radius: 9px;
            background: rgba(7, 13, 23, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            font-size: 10px;
            pointer-events: none;
        }
        #legend i {
            display: inline-block;
            width: 15px;
            height: 3px;
            background: #38bdf8;
            vertical-align: middle;
            margin-right: 6px;
            border-radius: 2px;
        }
        #empty {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 900;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="legend"><i></i>行程路线</div>
<div id="empty" style="display:none">暂无轨迹数据</div>
<script src="leaflet.js"></script>
<script>
(function () {
    "use strict";

    var PI = 3.1415926535897932384626;
    var AA = 6378245.0;
    var EE = 0.00669342162296594323;

    function outOfChina(lat, lng) {
        return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
    }

    function transformLat(x, y) {
        var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * PI) + 320.0 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformLng(x, y) {
        var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
        return ret;
    }

    function wgs84ToGcj02(lat, lng) {
        if (outOfChina(lat, lng)) return [lat, lng];
        var dLat = transformLat(lng - 105.0, lat - 35.0);
        var dLng = transformLng(lng - 105.0, lat - 35.0);
        var radLat = lat / 180.0 * PI;
        var magic = Math.sin(radLat);
        magic = 1 - EE * magic * magic;
        var sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180.0) / ((AA * (1 - EE)) / (magic * sqrtMagic) * PI);
        dLng = (dLng * 180.0) / (AA / sqrtMagic * Math.cos(radLat) * PI);
        return [lat + dLat, lng + dLng];
    }

    function gcj02ToWgs84(lat, lng) {
        if (outOfChina(lat, lng)) return [lat, lng];
        var g = wgs84ToGcj02(lat, lng);
        return [lat * 2 - g[0], lng * 2 - g[1]];
    }

    var useAmap = true;
    var route = [];
    var map;
    var currentLayer;
    var lineCasing = null;
    var line = null;
    var startMarker = null;
    var endMarker = null;

    var amapLayer = L.tileLayer(
        "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",
        { subdomains: "1234", maxZoom: 18, attribution: "地图数据 © 高德地图" }
    );
    var osmLayer = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19, attribution: "© OpenStreetMap contributors" }
    );

    function display(lat, lng) {
        return useAmap ? wgs84ToGcj02(lat, lng) : [lat, lng];
    }

    function unDisplay(lat, lng) {
        return useAmap ? gcj02ToWgs84(lat, lng) : [lat, lng];
    }

    function clearRouteLayers() {
        if (lineCasing) { map.removeLayer(lineCasing); lineCasing = null; }
        if (line) { map.removeLayer(line); line = null; }
        if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
        if (endMarker) { map.removeLayer(endMarker); endMarker = null; }
    }

    function drawRoute(fit) {
        clearRouteLayers();
        if (!route || route.length < 2) {
            document.getElementById("empty").style.display = "block";
            return;
        }
        document.getElementById("empty").style.display = "none";
        var latlngs = [];
        for (var i = 0; i < route.length; i++) {
            var d = display(route[i][0], route[i][1]);
            latlngs.push(L.latLng(d[0], d[1]));
        }

        lineCasing = L.polyline(latlngs, {
            color: "#07111f",
            weight: 7,
            opacity: 0.85,
            lineJoin: "round",
            lineCap: "round",
            interactive: false
        }).addTo(map);
        line = L.polyline(latlngs, {
            color: "#38bdf8",
            weight: 3.5,
            opacity: 1,
            lineJoin: "round",
            lineCap: "round",
            interactive: false
        }).addTo(map);

        startMarker = L.circleMarker(latlngs[0], {
            radius: 7,
            color: "#f8fafc",
            weight: 2,
            fillColor: "#34d399",
            fillOpacity: 1,
            interactive: false
        }).addTo(map);
        endMarker = L.circleMarker(latlngs[latlngs.length - 1], {
            radius: 7,
            color: "#f8fafc",
            weight: 2,
            fillColor: "#f87171",
            fillOpacity: 1,
            interactive: false
        }).addTo(map);

        if (fit) {
            map.fitBounds(L.latLngBounds(latlngs), {
                padding: [28, 28],
                maxZoom: 17,
                animate: false
            });
        }
    }

    function switchLayer() {
        var c = map.getCenter();
        var centerWgs = unDisplay(c.lat, c.lng);
        var zoom = map.getZoom();
        map.removeLayer(currentLayer);
        useAmap = !useAmap;
        currentLayer = useAmap ? amapLayer : osmLayer;
        currentLayer.addTo(map);
        map.setView(display(centerWgs[0], centerWgs[1]), zoom, { animate: false });
        drawRoute(true);
        document.getElementById("layerToggle").textContent = useAmap ? "底图：高德" : "底图：OSM";
    }

    map = L.map("map", {
        zoomControl: false,
        attributionControl: true,
        preferCanvas: true
    });
    map.attributionControl.setPrefix("");
    currentLayer = amapLayer;
    currentLayer.addTo(map);
    map.setView([35.0, 105.0], 4);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    var toggle = L.DomUtil.create("div", "layer-toggle");
    toggle.id = "layerToggle";
    toggle.textContent = "底图：高德";
    toggle.title = "切换高德 / OpenStreetMap 底图";
    toggle.addEventListener("click", function (e) {
        L.DomEvent.stopPropagation(e);
        switchLayer();
    });
    map.getContainer().appendChild(toggle);

    window.setRoute = function (data) {
        route = data || [];
        drawRoute(true);
    };
    window.setRouteFromJson = function (json) {
        try {
            route = JSON.parse(json) || [];
            drawRoute(true);
        } catch (e) {
            route = [];
            drawRoute(false);
        }
    };

    setTimeout(function () {
        if (window.AndroidTrip && AndroidTrip.onReady) {
            AndroidTrip.onReady();
        }
    }, 120);
})();
</script>
</body>
</html>
